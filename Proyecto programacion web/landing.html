<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CleanExperts — Menú</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon_cleanexperts.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --brand:#0ea5e9; --ink:#0b1220; --muted:#475569; --bd:#e5e7eb; --pad:24px; --radius:12px; }
    html{ font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; color:var(--ink); }
    .brand a,.brand-name{ color:var(--brand)!important; text-decoration:none } .brand a{ font-weight:700; letter-spacing:-.01em }
    .topbar{ position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--bd) }
    .nav ul{ display:flex; gap:14px; align-items:center; padding:12px var(--pad); margin:0; list-style:none }
    .nav__link{ padding:10px 12px; border-radius:10px; text-decoration:none; color:var(--ink); font-weight:600; letter-spacing:.02em; }
    .nav__link:hover, .nav__link[aria-current="page"]{ background:#f1f5f9 }
    .landing{ max-width:1100px; margin:0 auto; padding:calc(var(--pad) + 8px) var(--pad); text-align:center }
    .btn{ appearance:none; border:0; border-radius:12px; cursor:pointer; font-weight:700; min-height:44px; padding-block:12px; padding-inline:clamp(14px,2.5vw,22px); font-size:clamp(.95rem,.9rem + .3vw,1.05rem); transition:transform .06s, box-shadow .2s, opacity .2s; margin:6px }
    .btn--primary{ background:var(--brand); color:#fff } .btn--ghost{ background:#f1f5f9; color:var(--ink) }
    .btn:focus-visible{ outline:3px solid color-mix(in srgb, var(--brand) 40%, transparent); outline-offset:2px } .btn:active{ transform:translateY(1px) }
    .footer{border-top:1px solid var(--bd);padding:18px var(--pad);text-align:center;color:var(--muted)}
    .tour360{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.98);z-index:10000}
    .tour360.is-open{display:grid}
    .tour360__frame{width:min(96vw,1400px);height:min(90vh,850px);border:0;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
    .tour360__close{position:absolute;top:14px;right:18px;font-size:34px;line-height:1;background:transparent;border:0;color:#fff;cursor:pointer}
    .tour360__close:focus{outline:3px solid color-mix(in srgb, var(--brand) 50%, transparent);outline-offset:2px}
    @media (max-width:640px){ .tour360__frame{width:100vw;height:100vh;border-radius:0} }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" style="padding-left:var(--pad);"><a href="index.html">CleanExperts</a></div>
    <nav class="nav" aria-label="Navegación principal">
      <ul>
        <li><a class="nav__link" href="login.html">Inicio</a></li>
        <li><a class="nav__link" href="apps.html">Servicios</a></li>
        <li><a class="nav__link" href="gallery.html">Galería</a></li>
        <li><a class="nav__link" href="contacto.html">Contacto</a></li>
        <li><a class="nav__link" href="#" id="navTour360">Tour 360</a></li>
      </ul>
    </nav>
  </header>

  <section class="landing">
    <h2 style="margin:0 0 8px; font-size:clamp(1.9rem,1.6rem + 1.3vw,2.6rem)">Selecciona el producto digital</h2>
    <div class="btn-group" style="display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px">
      <a class="btn btn--primary" href="inicio.html">Sitio Web JS</a>
      <a class="btn btn--ghost" href="apps.html">Aplicación Web JS</a>
    </div>
  </section>

  <footer class="footer"><p>© 2025 CleanExperts</p></footer>

  <!-- Overlay: Tour 360 -->
  <div id="tour360" class="tour360" aria-hidden="true" role="dialog" aria-label="Tour Virtual 360">
    <button class="tour360__close" aria-label="Cerrar tour">&times;</button>
    <iframe class="tour360__frame" src="about:blank" title="Visor 360"></iframe>
  </div>

  <script>
  (()=>{
    const btn=document.getElementById('navTour360'); if(!btn) return;
    const modal=document.getElementById('tour360'); const frame=modal.querySelector('.tour360__frame'); const close=modal.querySelector('.tour360__close'); let lastFocus=null;
    function open(){ lastFocus=document.activeElement; frame.src='tour.html'; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); close.focus(); document.addEventListener('keydown',onKey); }
    function closeIt(){ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); frame.src='about:blank'; document.removeEventListener('keydown',onKey); if(lastFocus) lastFocus.focus(); }
    function onKey(e){ if(e.key==='Escape') closeIt(); }
    btn.addEventListener('click',e=>{e.preventDefault();open();}); close.addEventListener('click',closeIt);
    modal.addEventListener('click',e=>{ if(e.target===modal) closeIt(); });
  })();
  (()=>{
    const BRAND='CleanExperts',RE=new RegExp(BRAND,'gi'); const logo=document.querySelector('.brand a'); if(logo) logo.textContent=BRAND;
    const targets=document.querySelectorAll('h1,h2,h3,.brand,.nav,p,.footer');
    function wrap(el){ const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null); const nodes=[]; for(let n;(n=w.nextNode());) nodes.push(n);
      nodes.forEach(node=>{ const t=node.nodeValue; if(!RE.test(t)) return; const s=document.createElement('span'); s.innerHTML=t.replace(RE,'<span class="brand-name">$&</span>'); node.replaceWith(...s.childNodes); });
    } targets.forEach(wrap);
  })();
  </script>
</body>
</html>
