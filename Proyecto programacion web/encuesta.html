<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>CleanExperts — Encuesta Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon_cleanexperts.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">

  <style>
    *,*::before,*::after{ box-sizing:border-box }
    html{ font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial }
    body{ margin:0; color:#0b1220; background:#fff }
    :root{ --brand:#0ea5e9; --ink:#0b1220; --muted:#475569; --bd:#e5e7eb; --pad:24px; --radius:12px }

    .topbar{ position:sticky; top:0; z-index:50; background:#fff; border-bottom:1px solid var(--bd) }
    .topbar-inner{ display:flex; align-items:center; gap:16px; padding:12px var(--pad) }
    .brand a{ color:var(--brand)!important; text-decoration:none; font-weight:700 }
    .nav ul{ display:flex; gap:14px; align-items:center; padding:0; margin:0; list-style:none; width:100% }
    .nav__link{ padding:10px 12px; border-radius:10px; text-decoration:none; color:#0b1220; font-weight:600 }
    .nav__link:hover, .nav__link[aria-current="page"]{ background:#f1f5f9 }

    /* Dropdown */
    .nav__group{ position:relative }
    .nav__toggle{ background:transparent; border:0; cursor:pointer; font:inherit; color:inherit; padding:10px 12px; border-radius:10px }
    .nav__menu{
      position:absolute; top:100%; left:0; min-width:220px; background:#fff; border:1px solid var(--bd); border-radius:12px;
      box-shadow:0 10px 30px rgba(0,0,0,.08); padding:8px; display:none; z-index:60;
    }
    .nav__item{ display:block; padding:10px 12px; border-radius:10px; color:#0b1220; text-decoration:none; white-space:nowrap }
    .nav__item:hover{ background:#f1f5f9 }
    .nav__group.is-open .nav__menu{ display:block }

    .wrap{ max-width:900px; margin:0 auto; padding:calc(var(--pad) + 8px) var(--pad) }
    .title{ margin:0 0 6px; font-size:clamp(1.8rem,1.4rem + 1.3vw,2.4rem); font-weight:800 }
    .muted{ color:var(--muted) }

    .card{ background:#fff; border:1px solid var(--bd); border-radius:var(--radius); padding:18px 16px; box-shadow:0 8px 24px rgba(16,24,40,.05) }

    label{ font-weight:600; display:block; margin-bottom:6px }
    input[type="text"],input[type="email"],select,textarea{
      width:100%; border:1px solid var(--bd); border-radius:12px; padding:12px 14px; font-size:16px; color:#0b1220; background:#fff; outline:none;
    }
    input:focus,select:focus,textarea:focus{ border-color:var(--brand); box-shadow:0 0 0 3px rgba(14,165,233,.18) }
    textarea{ min-height:110px; resize:vertical }

    .row{ display:grid; gap:10px; grid-template-columns: 1fr }
    .likert, .nps{ display:flex; gap:8px; flex-wrap:wrap; align-items:center }
    .chip{
      padding:10px 12px; border:1px solid var(--bd); border-radius:10px; cursor:pointer; user-select:none;
      min-width:40px; text-align:center; background:#fff;
    }
    .chip input{ display:none }
    .chip.is-selected{ background:#e6f6fd; border-color:#bae6fd; color:#0369a1; font-weight:700 }

    .btn{ appearance:none; border-radius:12px; cursor:pointer; font-weight:700; min-height:44px; padding:12px 16px; border:0; background:#0ea5e9; color:#fff }
    .btn:focus-visible{ outline:3px solid rgba(14,165,233,.25); outline-offset:2px }

    footer{ border-top:1px solid var(--bd); padding:18px var(--pad); text-align:center; color:#64748b }

    /* Tour overlay */
    .tour360{ position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.98); z-index:10000 }
    .tour360.is-open{ display:grid }
    .tour360__frame{ width:min(96vw,1400px); height:min(90vh,850px); border:0; border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.5) }
    .tour360__close{ position:absolute; top:14px; right:18px; font-size:34px; line-height:1; background:transparent; border:0; color:#fff; cursor:pointer }
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><a href="index.html">CleanExperts</a></div>
    <nav class="nav" aria-label="Navegación principal">
      <ul>
        <li><a class="nav__link" href="login.html">Inicio</a></li>
        <li><a class="nav__link" href="apps.html">Servicios</a></li>
        <li><a class="nav__link" href="gallery.html">Galería</a></li>
        <li><a class="nav__link" href="contacto.html">Contacto</a></li>
        <li class="nav__group">
          <button class="nav__toggle nav__link" aria-haspopup="true" aria-expanded="false">Formularios ▾</button>
          <div class="nav__menu" role="menu">
            <a class="nav__item" role="menuitem" href="contacto_form.html">Contacto</a>
            <a class="nav__item" role="menuitem" href="suscripcion.html">Suscripción</a>
            <a class="nav__item" role="menuitem" href="encuesta.html" aria-current="page">Encuesta</a>
          </div>
        </li>
        <li><a class="nav__link" href="#" id="navTour360">Tour 360</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1 class="title">Encuesta de satisfacción</h1>
  <p class="muted">Su opinión nos ayuda a mejorar. Tarda ~1 minuto.</p>

  <section class="card">
    <form id="formEncuesta" novalidate>
      <div class="row">
        <div>
          <label for="eNombre">Nombre (opcional)</label>
          <input id="eNombre" type="text" placeholder="Puede dejarlo en blanco">
        </div>
        <div>
          <label for="eEmail">Correo (opcional)</label>
          <input id="eEmail" type="email" placeholder="Para darle seguimiento si desea">
        </div>
        <div>
          <label for="eServicio">¿Qué servicio utilizó?</label>
          <select id="eServicio">
            <option>Residencial</option>
            <option>Oficinas</option>
            <option>Vehículos</option>
            <option>Otro</option>
          </select>
        </div>
        <div>
          <label>Calidad del servicio</label>
          <div class="likert" data-name="calidad">
            <label class="chip"><input type="radio" name="calidad" value="1">1</label>
            <label class="chip"><input type="radio" name="calidad" value="2">2</label>
            <label class="chip"><input type="radio" name="calidad" value="3">3</label>
            <label class="chip"><input type="radio" name="calidad" value="4">4</label>
            <label class="chip"><input type="radio" name="calidad" value="5">5</label>
          </div>
        </div>
        <div>
          <label>Puntualidad</label>
          <div class="likert" data-name="puntualidad">
            <label class="chip"><input type="radio" name="puntualidad" value="1">1</label>
            <label class="chip"><input type="radio" name="puntualidad" value="2">2</label>
            <label class="chip"><input type="radio" name="puntualidad" value="3">3</label>
            <label class="chip"><input type="radio" name="puntualidad" value="4">4</label>
            <label class="chip"><input type="radio" name="puntualidad" value="5">5</label>
          </div>
        </div>
        <div>
          <label>Relación calidad/precio</label>
          <div class="likert" data-name="valor">
            <label class="chip"><input type="radio" name="valor" value="1">1</label>
            <label class="chip"><input type="radio" name="valor" value="2">2</label>
            <label class="chip"><input type="radio" name="valor" value="3">3</label>
            <label class="chip"><input type="radio" name="valor" value="4">4</label>
            <label class="chip"><input type="radio" name="valor" value="5">5</label>
          </div>
        </div>
        <div>
          <label>¿Qué tan probable es que nos recomiende? (0–10)</label>
          <div class="nps" id="nps"></div>
        </div>
        <div>
          <label for="eComentarios">Comentarios (opcional)</label>
          <textarea id="eComentarios" placeholder="¿Qué podríamos mejorar? ¿Qué le gustó más?"></textarea>
        </div>
        <div>
          <button class="btn" type="submit">Enviar encuesta</button>
        </div>
      </div>
    </form>
  </section>
</main>

<footer>© 2025 CleanExperts</footer>

<!-- Tour overlay -->
<div id="tour360" class="tour360" aria-hidden="true" role="dialog" aria-label="Tour Virtual 360">
  <button class="tour360__close" aria-label="Cerrar tour">&times;</button>
  <iframe class="tour360__frame" src="about:blank" title="Visor 360"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
  // Dropdown accesible
  (() => {
    const grp = document.querySelector('.nav__group'); if(!grp) return;
    const btn = grp.querySelector('.nav__toggle');
    btn.addEventListener('click', () => {
      const open = grp.classList.toggle('is-open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    document.addEventListener('click', (e) => {
      if(!grp.contains(e.target)) { grp.classList.remove('is-open'); btn.setAttribute('aria-expanded','false'); }
    });
    document.addEventListener('keydown', (e) => { if(e.key==='Escape'){ grp.classList.remove('is-open'); btn.setAttribute('aria-expanded','false'); }});
  })();

  // Render chips NPS 0..10
  (()=>{
    const nps = document.getElementById('nps');
    for(let i=0;i<=10;i++){
      const lab = document.createElement('label');
      lab.className='chip';
      lab.innerHTML = `<input type="radio" name="nps" value="${i}">${i}`;
      nps.appendChild(lab);
    }
  })();

  // Estilo de selección para chips
  document.addEventListener('change', (e)=>{
    if(e.target && e.target.type==='radio'){
      const name = e.target.name;
      document.querySelectorAll(`input[name="${name}"]`).forEach(inp=>{
        inp.parentElement.classList.toggle('is-selected', inp.checked);
      });
    }
  });

  // Guardado local simulado y confirmación
  document.getElementById('formEncuesta').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const getVal = (name)=>{ const el = document.querySelector(`input[name="${name}"]:checked`); return el? el.value : null; };

    const data = {
      nombre: document.getElementById('eNombre').value.trim() || null,
      email:  document.getElementById('eEmail').value.trim() || null,
      servicio: document.getElementById('eServicio').value,
      calidad: getVal('calidad'),
      puntualidad: getVal('puntualidad'),
      valor: getVal('valor'),
      nps: getVal('nps'),
      comentarios: document.getElementById('eComentarios').value.trim() || null,
      ts: Date.now()
    };

    if(!data.calidad || !data.puntualidad || !data.valor || data.nps===null){
      Swal.fire({icon:'warning',title:'Faltan respuestas',text:'Calidad, puntualidad, valor y NPS son requeridos.',confirmButtonColor:'#0ea5e9'}); return;
    }

    const surveys = JSON.parse(localStorage.getItem('cx_surveys')||'[]');
    surveys.push(data);
    localStorage.setItem('cx_surveys', JSON.stringify(surveys));

    await Swal.fire({icon:'success',title:'¡Gracias por su opinión!',text:'Su respuesta fue registrada.',confirmButtonColor:'#0ea5e9'});
    e.target.reset();
    document.querySelectorAll('.chip.is-selected').forEach(c=>c.classList.remove('is-selected'));
  });

  // Tour 360
  (()=>{const btn=document.getElementById('navTour360'); if(!btn) return;
    const modal=document.getElementById('tour360'); const frame=modal.querySelector('.tour360__frame'); const close=modal.querySelector('.tour360__close');
    function open(){ frame.src='tour.html'; modal.classList.add('is-open'); modal.setAttribute('aria-hidden','false'); document.addEventListener('keydown',onKey) }
    function closeIt(){ modal.classList.remove('is-open'); modal.setAttribute('aria-hidden','true'); frame.src='about:blank'; document.removeEventListener('keydown',onKey) }
    function onKey(e){ if(e.key==='Escape') closeIt(); }
    btn.addEventListener('click',e=>{e.preventDefault();open();}); close.addEventListener('click',closeIt); modal.addEventListener('click',e=>{ if(e.target===modal) closeIt(); });
  })();
</script>
</body>
</html>
